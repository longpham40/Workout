<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1110" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Train & Eat">
  <title>Train & Eat</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="appbar" id="appbar"></header>

  <main id="view"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/today" data-route="today"><span data-icon="today"></span>Today</a>
    <a href="#/train" data-route="train"><span data-icon="train"></span>Train</a>
    <a href="#/eat" data-route="eat"><span data-icon="eat"></span>Eat</a>
    <a href="#/progress" data-route="progress"><span data-icon="progress"></span>Progress</a>
  </nav>

  <div id="timer" class="timer" role="timer" hidden>
    <div class="timer-fill"></div>
    <span class="timer-label">Rest</span>
    <span class="timer-time">0:00</span>
    <button data-timer="add" aria-label="Add 15 seconds">+15 s</button>
    <button data-timer="skip">Skip</button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Content you can edit -->
  <script src="data/workouts.js"></script>
  <script src="data/exercises.js"></script>
  <script src="data/programs.js"></script>
  <script src="data/recipes.js"></script>
  <script src="data/meal-plans.js"></script>
  <!-- App code -->
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nutrition.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/train.js"></script>
  <script src="js/session.js"></script>
  <script src="js/eat.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
